services:
  - type: web
    name: marine-debris-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_MODE
        value: demo
      - key: FRONTEND_URL
        sync: false   # set this in Render dashboard after Vercel deploy
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./marine_debris.db
